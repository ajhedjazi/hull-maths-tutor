<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Thank you for your enquiry | Hull Maths Tutor</title>
<link rel="stylesheet" href="/styles.css">
<style>
.thanks-wrap{min-height:75vh;display:grid;place-items:center;padding:48px 20px;background:#f5f1e8}
.thanks-card{width:min(100%,620px);background:#fff;border:1px solid #dbe6e3;border-radius:24px;padding:clamp(28px,5vw,56px);text-align:center;box-shadow:0 16px 50px rgba(10,55,55,.08)}
.thanks-check{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#e5f4ed;color:#126b50;font-size:36px;font-weight:700;margin-bottom:20px}
.thanks-card h1{color:#0b4344;font-size:clamp(2rem,5vw,3rem);line-height:1.2;margin:0 0 16px}
.thanks-card p{color:#334d4b;line-height:1.7;margin:0 0 24px}
.thanks-card a{display:inline-block;background:#0b4344;color:white;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:700}
.thanks-card a:focus-visible{outline:3px solid #c69c49;outline-offset:3px}
</style>
</head>
<body>
<main class="thanks-wrap">
<section class="thanks-card" aria-labelledby="thanks-title">
<div class="thanks-check" aria-hidden="true">✓</div>
<h1 id="thanks-title">Thank you for your enquiry!</h1>
<p>Your message has been sent to Hull Maths Tutor. I'll get back to you as soon as I can.</p>
<a href="/">Back to Hull Maths Tutor</a>
</section>
</main>
</body>
</html>
